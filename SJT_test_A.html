<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>SJT 文法・文字ごい・読解テストA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --pri:#2563eb; --pri-d:#1d4ed8; --pri-l:#eff6ff; --ok:#16a34a; --ng:#dc2626;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink);
       font-size:17px;line-height:1.7;-webkit-text-size-adjust:100%}
  .app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--card)}
  @media (min-width:680px){ body{padding:24px 0} .app{min-height:auto;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);overflow:hidden} }

  header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:12px 16px 10px}
  header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.02em}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:#cbd5e1}
  .bar{height:4px;background:#334155;border-radius:4px;margin-top:8px;overflow:hidden}
  .bar>div{height:100%;width:0;background:#60a5fa;transition:width .3s}

  main{flex:1;padding:20px 16px 24px}
  .screen{display:none;animation:fade .25s ease-out}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h2{font-size:22px;margin:0 0 6px}
  .muted{color:var(--sub);font-size:14px}
  label{display:block;font-weight:700;font-size:14px;margin:18px 0 6px}
  input[type=text]{width:100%;font-size:16px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#f8fafc;outline:none;font-family:inherit}
  input[type=text]:focus{border-color:var(--pri);background:#fff}
  .err{color:var(--ng);font-size:13px;margin-top:8px;min-height:1em}

  .btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn-pri{background:var(--pri);color:#fff}
  .btn-pri:active{background:var(--pri-d)}
  .btn-pri:disabled{background:#cbd5e1;color:#fff;cursor:not-allowed}
  .btn-sub{background:#f1f5f9;color:#475569}
  .btn-sub:disabled{opacity:.35}

  .parts{list-style:none;padding:0;margin:18px 0}
  .parts li{display:flex;justify-content:space-between;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:15px}
  .parts li span:last-child{color:var(--sub)}

  .intro{text-align:center;padding-top:30px}
  .intro .num{display:inline-block;background:var(--pri-l);color:var(--pri);font-weight:700;border-radius:999px;padding:4px 14px;font-size:14px}
  .intro h2{font-size:30px;margin:14px 0 4px}
  .intro .en{color:var(--sub);margin-bottom:24px}

  .qmeta{display:flex;gap:6px;align-items:center;margin-bottom:10px}
  .badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#f1f5f9;color:#475569}
  .badge.lv{background:#0f172a;color:#fff}
  .instr{font-size:14px;font-weight:500;color:#1e40af;background:var(--pri-l);padding:10px 12px;border-radius:10px;margin-bottom:14px;line-height:1.9}
  .qtext{font-size:19px;font-weight:500;white-space:pre-wrap;word-break:break-word;margin-bottom:18px;line-height:2.1}
  .qtext.passage{font-size:17px;font-weight:400;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:2.2}
  ruby rt{font-size:.55em;color:#64748b;font-weight:400}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;
       padding:14px;font-size:17px;font-family:inherit;color:var(--ink);cursor:pointer;line-height:2}
  .opt .no{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;
           font-size:14px;font-weight:700;color:#64748b;margin-top:4px}
  .opt.sel{border-color:var(--pri);background:var(--pri-l)}
  .opt.sel .no{background:var(--pri);border-color:var(--pri);color:#fff}
  .opt .tx{flex:1;word-break:break-word}

  .nav{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + var(--safe-b));display:none;gap:10px}
  .nav.show{display:flex}
  .nav .btn-sub{flex:1}
  .nav .btn-pri{flex:2}

  .modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:380px}
  .modal .row{display:flex;gap:10px;margin-top:18px}

  .center{text-align:center}
  .icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:24px auto 12px;font-size:34px}
  .icon.wait{background:var(--pri-l)} .icon.ok{background:#dcfce7} .icon.ng{background:#fee2e2}
  .spin{width:30px;height:30px;border:4px solid #bfdbfe;border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  table{width:100%;border-collapse:collapse;margin-top:20px;font-size:15px}
  th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
  th{font-size:13px;color:var(--sub);font-weight:500}
  td.lvl{font-weight:700;color:var(--pri)}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>SJT 文法・文字ごい・読解テストA</h1>
    <div class="hrow" id="hrow" style="display:none"><span id="h-part"></span><span id="h-count"></span></div>
    <div class="bar" id="hbar" style="display:none"><div id="h-bar"></div></div>
  </header>

  <main>
    <!-- 開始画面 -->
    <section class="screen active" id="s-start">
      <h2>ようこそ</h2>
      <p class="muted">なまえと がくせいばんごうを いれて ください。<br>Please enter your name and student ID.</p>
      <label for="in-name">氏名 / Name</label>
      <input type="text" id="in-name" autocomplete="name" placeholder="例：山田 太郎">
      <label for="in-id">学生番号 / Student ID</label>
      <input type="text" id="in-id" inputmode="text" autocomplete="off" placeholder="例：234001">
      <div class="err" id="start-err"></div>
      <ul class="parts" id="part-list"></ul>
      <p class="muted">・こたえを えらんでから「つぎへ」を おして ください。<br>・テストの とちゅうで ページを とじないで ください。<br>・さいごに けっかが じどうで そうしんされます。</p>
      <button class="btn btn-pri" id="btn-start" style="margin-top:18px">テストを はじめる / Start</button>
    </section>

    <!-- パート開始画面 -->
    <section class="screen" id="s-intro">
      <div class="intro">
        <span class="num" id="intro-num"></span>
        <h2 id="intro-title"></h2>
        <div class="en" id="intro-en"></div>
        <button class="btn btn-pri" id="btn-intro">はじめる / Begin</button>
      </div>
    </section>

    <!-- 問題画面 -->
    <section class="screen" id="s-q">
      <div class="qmeta"><span class="badge lv" id="q-lv"></span><span class="badge" id="q-no"></span></div>
      <div class="instr" id="q-instr"></div>
      <div class="qtext" id="q-text"></div>
      <div class="opts" id="q-opts"></div>
    </section>

    <!-- 終了画面 -->
    <section class="screen" id="s-end">
      <div class="center">
        <div class="icon wait" id="end-icon"><div class="spin"></div></div>
        <h2 id="end-title">そうしんちゅう…</h2>
        <p class="muted" id="end-desc">けっかを そうしんしています。ページを とじないで ください。<br>Submitting your results…</p>
      </div>
      <div id="end-result"></div>
      <button class="btn btn-pri" id="btn-retry" style="display:none;margin-top:18px">もう一度そうしんする / Retry</button>
    </section>
  </main>

  <div class="nav" id="nav">
    <button class="btn btn-sub" id="btn-prev">もどる</button>
    <button class="btn btn-pri" id="btn-next" disabled>つぎへ</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <div id="modal-text"></div>
    <div class="row">
      <button class="btn btn-sub" id="modal-no">もどる</button>
      <button class="btn btn-pri" id="modal-yes">はい</button>
    </div>
  </div>
</div>

const PARTS = [
  { key:"grammar", title:"文法",     kana:"ぶんぽう", en:"Grammar",          scoreKey:"grammarScore", levelKey:"grammarLevel" },
  { key:"vocab",   title:"文字ごい", kana:"もじごい", en:"Kanji & Vocabulary", scoreKey:"vocabScore",   levelKey:"vocabLevel" },
  { key:"reading", title:"読解",     kana:"どっかい", en:"Reading",          scoreKey:"readingScore", levelKey:"readingLevel" }
];
PARTS.forEach(p => p.questions = DATA[p.key]);
const TOTAL = PARTS.reduce((n,p)=>n+p.questions.length,0);

/* ---------- 状態 ---------- */
const st = { name:"", sid:"", part:0, idx:0, answers:PARTS.map(p=>new Array(p.questions.length).fill(null)), orders:[], inTest:false, payload:null };

const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  $("nav").classList.toggle("show", id==="s-q");
  window.scrollTo(0,0);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function done(){ return PARTS.slice(0,st.part).reduce((n,p)=>n+p.questions.length,0) + st.idx; }

/* ---------- 開始画面 ---------- */
$("part-list").innerHTML = PARTS.map((p,i)=>`<li><span>第${i+1}部　${p.title}</span><span>${p.questions.length}問</span></li>`).join("");

$("btn-start").onclick = () => {
  const name = $("in-name").value.trim(), sid = $("in-id").value.trim();
  if (!name || !sid){ $("start-err").textContent = "氏名と学生番号を入力してください。/ Please enter your name and student ID."; return; }
  st.name = name; st.sid = sid; st.inTest = true;
  st.orders = PARTS.map(p => p.questions.map(q => { const o=[0,1,2,3]; return CONFIG.SHUFFLE_OPTIONS ? shuffle(o) : o; }));
  $("hrow").style.display = ""; $("hbar").style.display = "";
  openIntro();
};

/* ---------- パート開始 ---------- */
function openIntro(){
  const p = PARTS[st.part];
  $("intro-num").textContent = `第${st.part+1}部 / Part ${st.part+1}`;
  $("intro-title").innerHTML = `<ruby>${p.title}<rt>${p.kana}</rt></ruby>`;
  $("intro-en").textContent = `${p.en}　全${p.questions.length}問`;
  updateHeader();
  show("s-intro");
}
$("btn-intro").onclick = () => { st.idx = 0; renderQ(); show("s-q"); };

function updateHeader(){
  const p = PARTS[st.part];
  $("h-part").textContent = `第${st.part+1}部　${p.title}`;
  $("h-count").textContent = `${Math.min(st.idx+1,p.questions.length)} / ${p.questions.length}`;
  $("h-bar").style.width = (done()/TOTAL*100) + "%";
}

/* ---------- 問題表示 ---------- */
function renderQ(){
  const p = PARTS[st.part], q = p.questions[st.idx];
  $("q-lv").textContent = q.level;
  $("q-no").textContent = `${p.title} ${st.idx+1}`;
  $("q-instr").innerHTML = q.instruction;
  const t = $("q-text");
  t.innerHTML = q.question;
  t.classList.toggle("passage", p.key==="reading");
  const box = $("q-opts"); box.innerHTML = "";
  st.orders[st.part][st.idx].forEach((oi, n) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (st.answers[st.part][st.idx]===oi ? " sel" : "");
    b.innerHTML = `<span class="no">${n+1}</span><span class="tx">${q.options[oi]}</span>`;
    b.onclick = () => { st.answers[st.part][st.idx] = oi; renderQ(); };
    box.appendChild(b);
  });
  $("btn-prev").disabled = st.idx===0;
  $("btn-next").disabled = st.answers[st.part][st.idx]===null;
  const last = st.idx===p.questions.length-1;
  $("btn-next").textContent = last ? (st.part===PARTS.length-1 ? "おわる / Finish" : "つぎのパートへ") : "つぎへ";
  updateHeader();
}

$("btn-prev").onclick = () => { if (st.idx>0){ st.idx--; renderQ(); window.scrollTo(0,0);} };
$("btn-next").onclick = () => {
  const p = PARTS[st.part];
  if (st.answers[st.part][st.idx]===null) return;
  if (st.idx < p.questions.length-1){ st.idx++; renderQ(); window.scrollTo(0,0); return; }
  if (st.part < PARTS.length-1){
    confirmBox(`<b>第${st.part+1}部「${p.title}」を おわります。</b><p class="muted">つぎのパートに すすむと、このパートには もどれません。<br>You cannot return to this part.</p>`,
      () => { st.part++; st.idx=0; openIntro(); });
  } else {
    confirmBox(`<b>テストを おわりますか。</b><p class="muted">けっかを そうしんします。そうしんしたあとは なおせません。<br>Your answers will be submitted.</p>`, finish);
  }
};

function confirmBox(html, onYes){
  $("modal-text").innerHTML = html;
  $("modal").classList.add("show");
  $("modal-no").onclick = () => $("modal").classList.remove("show");
  $("modal-yes").onclick = () => { $("modal").classList.remove("show"); onYes(); };
}

/* ---------- 採点・送信 ---------- */
function score(){
  return PARTS.map((p,pi)=>{
    const correct = p.questions.reduce((n,q,i)=>n+(st.answers[pi][i]===q.answer?1:0),0);
    const pct = correct/p.questions.length*100;
    return { part:p, correct, total:p.questions.length, pct, level:toLevel(pct) };
  });
}

function finish(){
  st.inTest = false;
  $("h-bar").style.width = "100%";
  $("h-count").textContent = "";
  $("h-part").textContent = "おわり / Finished";
  const res = score();
  const body = new URLSearchParams();
  body.append(CONFIG.ENTRY.name, st.name);
  body.append(CONFIG.ENTRY.studentId, st.sid);
  res.forEach(r=>{
    body.append(CONFIG.ENTRY[r.part.scoreKey], `${r.correct}/${r.total} (${Math.round(r.pct)}%)`);
    body.append(CONFIG.ENTRY[r.part.levelKey], r.level);
  });
  st.payload = body; st.result = res;
  show("s-end");
  send();
}

async function send(){
  $("btn-retry").style.display = "none";
  setEnd("wait","そうしんちゅう…","けっかを そうしんしています。ページを とじないで ください。<br>Submitting your results…");
  if (CONFIG.FORM_ACTION_URL.includes("YOUR_FORM_ID")){
    setEnd("ng","せっていエラー","Google フォームの せっていが まだです。先生に 知らせて ください。<br>(Google Form is not configured.)");
    showResult(); return;
  }
  try{
    await fetch(CONFIG.FORM_ACTION_URL, { method:"POST", mode:"no-cors", body:st.payload });
    setEnd("ok","おつかれさまでした！","けっかを そうしんしました。<br>Your results have been submitted.");
  }catch(e){
    console.error(e);
    setEnd("ng","そうしんできませんでした","インターネットの せつぞくを たしかめて、もう一度 そうしんして ください。<br>Please check your connection and retry.");
    $("btn-retry").style.display = "block";
  }
  showResult();
}
$("btn-retry").onclick = send;

function setEnd(kind,title,desc){
  const ic = $("end-icon");
  ic.className = "icon " + kind;
  ic.innerHTML = kind==="wait" ? '<div class="spin"></div>' : (kind==="ok" ? "✓" : "!");
  ic.style.color = kind==="ok" ? "var(--ok)" : "var(--ng)";
  $("end-title").textContent = title;
  $("end-desc").innerHTML = desc;
}

function showResult(){
  if (!CONFIG.SHOW_RESULT_TO_STUDENT){ $("end-result").innerHTML = ""; return; }
  $("end-result").innerHTML = `<table><tr><th>パート</th><th>スコア</th><th>%</th><th>レベル</th></tr>${
    st.result.map(r=>`<tr><td>${r.part.title}</td><td>${r.correct} / ${r.total}</td><td>${Math.round(r.pct)}%</td><td class="lvl">${r.level}</td></tr>`).join("")
  }</table><p class="muted center" style="margin-top:14px">${st.name}（${st.sid}）</p>`;
}

/* テスト中にページを閉じようとしたら警告 */
window.addEventListener("beforeunload", e => { if (st.inTest){ e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
